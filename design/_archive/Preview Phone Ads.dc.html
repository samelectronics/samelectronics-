<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#1A1B1D}</style>
<script src="./se-parts-lib.js"></script>
<script src="./se-phone-ad.js"></script>
<script src="./se-td-ad.js"></script>
</helmet>
<div style="display:flex;flex-wrap:wrap;gap:24px;padding:24px;font-family:Inter,sans-serif;color:#FFFFFF">
  <sc-for list="{{ slots }}" as="s" hint-placeholder-count="4">
    <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9CBCE">{{ s.label }}</span>
      <canvas data-ad="{{ s.id }}" width="384" height="832" style="width:192px;height:416px;border-radius:24px;background:#000000;display:block"></canvas>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    const go = () => { if (!window.SEPhoneAd || !window.SETdAd || !window.seParts) return setTimeout(go, 200); window.seParts.get().then((lib) => this.init(lib)); }; go();
  }
  init(lib) {
    const q = new URLSearchParams(location.search), ts = (q.get('t') || '').split(',').filter(Boolean).map(Number);
    this.ads = [...document.querySelectorAll('canvas[data-ad]')].map((cv) => cv.dataset.ad[0] === 'T' ? SETdAd.create(cv, { lib }) : SEPhoneAd.create(cv, { mode: cv.dataset.ad[0], lib }));
    window.seAdsAt = (arr) => this.ads.forEach((a, i) => a.draw(arr[i % arr.length]));
    window.__ads = this.ads;
    const t0 = performance.now(); const loop = () => { if (this.dead) return; if (!window.__adsHold) this.ads.forEach((a, i) => a.draw((performance.now() - t0) / 1000 + i * 1.3)); requestAnimationFrame(loop); };
    setTimeout(() => { if (ts.length) { window.__adsHold = 1; window.seAdsAt(ts); } loop(); }, 800);
  }
  componentWillUnmount() { this.dead = true; }
  renderVals() {
    const q = new URLSearchParams(location.search), m = (q.get('m') || 'AABB').split('');
    return { slots: m.map((c, i) => ({ id: c + i, label: 'Template ' + c + ' #' + (i + 1) })) };
  }
}
</script>
</body>
</html>
