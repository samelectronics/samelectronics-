<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./se-data.js"></script>
<style>body{margin:0;background:#1A1B1D}</style>
</helmet>
<dc-import name="SE Teardown" hint-size="100%,780vh"></dc-import>
<sc-if value="{{ dbg }}" hint-placeholder-val="{{ false }}">
<div style="position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(26,27,29,.88);color:#FFFFFF;font-family:'JetBrains Mono',monospace;font-size:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)">
  <span style="color:#F7C032">FRAME</span>
  <input type="range" min="0" max="239" value="{{ f }}" onInput="{{ scrub }}" style="width:260px;accent-color:#F7C032">
  <span style="width:84px">{{ f }} · p {{ pl }}</span>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { f: 0 };
  renderVals() {
    const f = this.state.f;
    return { dbg: /debug/.test(location.search), f, pl: (f / 239).toFixed(3), scrub: (e) => { const v = Number(e.target.value); this.setState({ f: v }); window.seTd && window.seTd(v / 239); } };
  }
}
</script>
</body>
</html>
