<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes fmmIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" style="position:relative;display:flex">
  <button onClick="{{ openAll }}" onFocus="{{ enter }}" aria-haspopup="true" aria-expanded="{{ open }}" style="display:flex;align-items:center;gap:9px;height:36px;padding:0 16px;border:none;border-radius:10px;background:#F7C032;color:#1A1B1D;font-weight:600;font-size:15px;font-family:Inter,sans-serif;cursor:pointer;white-space:nowrap;box-shadow:0 0 22px rgba(247,192,50,.35);transition:transform .2s,box-shadow .2s" style-hover="transform:translateY(-1px);box-shadow:0 0 34px rgba(255,219,110,.65)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Find My Part<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" style="transform:rotate({{ chevR }}deg);transition:transform .2s"><path d="m6 9 6 6 6-6"></path></svg></button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:50%;top:100%;padding-top:10px;transform:translateX(-50%);z-index:80">
      <div style="width:min(640px,calc(100vw - 32px));display:grid;grid-template-columns:220px minmax(0,1fr);border-radius:16px;overflow:hidden;background:linear-gradient(180deg,rgba(61,62,63,.97),rgba(38,40,43,.98));color:#FFFFFF;box-shadow:inset 0 2px 0 #F7C032,inset 0 0 0 1px rgba(255,255,255,.1),0 24px 60px rgba(0,0,0,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:fmmIn .2s cubic-bezier(.2,.8,.2,1) both">
        <div style="display:flex;flex-direction:column;padding:10px;border-right:1px solid rgba(255,255,255,.08);max-height:440px;overflow-y:auto;overflow-x:hidden">
          <span style="padding:6px 10px 8px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;color:#C9CBCE">BRANDS</span>
          <sc-for list="{{ brands }}" as="b" hint-placeholder-count="14">
            <button onMouseEnter="{{ b.hover }}" onClick="{{ b.pick }}" style="display:flex;align-items:center;justify-content:space-between;gap:10px;height:36px;flex:none;padding:0 10px;border:none;border-radius:8px;background:{{ b.bg }};color:#FFFFFF;cursor:pointer;text-align:left">
              <dc-import name="SE Brand Logo" brand="{{ b.id }}" color="{{ b.ink }}" h="14" hint-size="64px,14px"></dc-import>
              <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ b.sub }};white-space:nowrap">{{ b.q }}</span>
            </button>
          </sc-for>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;padding:16px">
          <span style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><span style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px">{{ cur.name }} models</span><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9CBCE;white-space:nowrap">{{ cur.n }}</span></span>
          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px">
            <sc-for list="{{ models }}" as="m" hint-placeholder-count="10">
              <button onClick="{{ m.pick }}" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border:none;border-radius:8px;background:transparent;color:#FFFFFF;cursor:pointer;text-align:left;transition:background .15s" style-hover="background:rgba(247,192,50,.12)">
                <span style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">{{ m.name }}</span>
                <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9CBCE;white-space:nowrap">{{ m.q }}</span>
              </button>
            </sc-for>
          </div>
          <button onClick="{{ cur.all }}" style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 14px;border-radius:10px;border:1.5px solid rgba(247,192,50,.6);background:transparent;color:#FFDB6E;font-size:14px;font-weight:600;font-family:Inter,sans-serif;cursor:pointer"><span>All {{ cur.name }} models in Find My Part</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: false, b: 'apple', data: window.SE_DATA || null };
  componentDidMount() { if (!this.state.data) this.iv = setInterval(() => { if (window.SE_DATA) { clearInterval(this.iv); this.setState({ data: window.SE_DATA }); } }, 80); }
  componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.t); }
  fire(d) { this.setState({ open: false }); window.dispatchEvent(new CustomEvent('se:fmp', { detail: d })); }
  renderVals() {
    const s = this.state, D = s.data, Br = D ? D.brands : [], Mo = D ? D.models : [], P = D ? D.products : [];
    if (this._D !== D) { this._D = D; const q = {}; const mb = {}; Mo.forEach((m) => (mb[m.id] = m.brand_id)); this._mq = {}; P.forEach((p) => { q[mb[p.model_id]] = (q[mb[p.model_id]] || 0) + p.stock_qty; this._mq[p.model_id] = (this._mq[p.model_id] || 0) + p.stock_qty; }); this._bq = q; }
    const k = (n) => (n >= 1000 ? (n / 1000).toFixed(1).replace('.0', '') + 'k' : String(n || 0));
    const curB = Br.find((x) => x.id === s.b) || { name: '', id: s.b }, ms = Mo.filter((m) => m.brand_id === s.b);
    return {
      open: s.open, chevR: s.open ? 180 : 0,
      enter: () => { clearTimeout(this.t); this.t = setTimeout(() => this.setState({ open: true }), 120); },
      leave: () => { clearTimeout(this.t); this.t = setTimeout(() => this.setState({ open: false }), 220); },
      openAll: () => this.fire({}),
      brands: Br.map((b) => { const on = b.id === s.b; return { id: b.id, q: k(this._bq[b.id]) + ' in stock', bg: on ? 'rgba(247,192,50,.14)' : 'transparent', ink: on ? '#FFDB6E' : '#FFFFFF', sub: on ? '#FFDB6E' : '#8C9096', hover: () => this.setState({ b: b.id }), pick: () => this.fire({ b: b.id }) }; }),
      cur: { name: curB.name, n: ms.length + ' models · ' + k(this._bq[s.b]) + ' parts in stock', all: () => this.fire({ b: s.b }) },
      models: ms.slice(0, 10).map((m) => ({ name: m.name, q: k(this._mq[m.id]) + ' parts in stock', pick: () => this.fire({ b: m.brand_id, m: m.id }) }))
    };
  }
}
</script>
</body>
</html>
