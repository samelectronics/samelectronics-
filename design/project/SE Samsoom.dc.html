<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:330},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;think&quot;,&quot;happy&quot;,&quot;found&quot;,&quot;low&quot;,&quot;wave&quot;,&quot;kiss&quot;,&quot;celebrate&quot;,&quot;sleep&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200,&quot;tsType&quot;:&quot;number&quot;},&quot;lookX&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;min&quot;:-1,&quot;max&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;lookY&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;min&quot;:-1,&quot;max&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;still&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;hold&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, m = p.mood || 'idle', size = Number(p.size) || 200, k = size / 200, still = !!p.still;
    const lx = Math.max(-1, Math.min(1, Number(p.lookX) || 0)), ly = Math.max(-1, Math.min(1, Number(p.lookY) || 0));
    const A = (s) => (still ? 'none' : s);
    const arc = m === 'happy' || m === 'wave' || m === 'celebrate' || m === 'kiss' || m === 'dabke';
    const L = { idle: [24, -10], think: [-120, -10], happy: [24, -150], found: [24, -96], low: [36, 14], wave: [24, -150], kiss: [24, -118], celebrate: [150, -150], sleep: [44, -36], blink: [24, -10], dabke: [-38, -160] }[m] || [24, -10];
    const hold = p.hold || '';
    return {
      W: size, H: Math.round(size * 1.25), k: k.toFixed(4),
      bodyAnim: A(m === 'dabke' ? 'smHop .9s cubic-bezier(.45,0,.55,1) infinite' : m === 'celebrate' ? 'smJump .9s cubic-bezier(.45,0,.55,1) infinite' : m === 'sleep' ? 'smBreath 4s ease-in-out infinite' : 'smBob 3.4s cubic-bezier(.45,0,.55,1) infinite'),
      tilt: (lx * 4 + (m === 'low' ? -6 : m === 'think' ? 4 : 0)).toFixed(1), antAnim: A('smAnt 3.6s infinite'),
      eyeX: (lx * 6).toFixed(1), eyeY: (ly * 4 + (m === 'think' ? -4 : 0) + (p.raise ? -5 : 0)).toFixed(1), lookAnim: A(m === 'idle' ? 'smLook 7s cubic-bezier(.45,0,.55,1) infinite' : 'none'),
      eCaps: m === 'idle' || m === 'think' || m === 'low' || m === 'blink', eArc: arc, eRound: m === 'found', eLine: m === 'sleep',
      eHL: m === 'think' ? 18 : m === 'low' ? 22 : 28, eHR: m === 'think' ? 28 : m === 'low' ? 14 : 28, eTopL: m === 'think' ? 10 : m === 'low' ? 6 : 4, eTopR: m === 'low' ? 14 : 4,
      blinkAnim: A(m === 'blink' ? 'smSlowBlink 1.3s cubic-bezier(.45,0,.55,1) 1 both' : m === 'idle' || m === 'think' || m === 'low' ? 'smBlink 4.2s infinite' : 'none'), rArcO: m === 'kiss' ? 0 : 1, winkR: m === 'kiss',
      blush: m === 'kiss' || m === 'celebrate' || m === 'happy', mSmile: m === 'idle' || m === 'blink' || arc || m === 'found', mW: m === 'idle' || m === 'blink' ? 18 : 26, mHh: m === 'idle' || m === 'blink' ? 8 : 12, mO: m === 'sleep', mWavy: m === 'low', mDots: m === 'think',
      armLx: 36, armRx: 144, armLa: L[0], armRa: L[1],
      armLanim: A(m === 'celebrate' ? 'smWave .5s ease-in-out infinite' : m === 'think' ? 'smTap .8s ease-in-out infinite' : 'none'),
      armRanim: A(m === 'wave' ? 'smWaveOnce 2.4s cubic-bezier(.45,0,.55,1) 1 both' : m === 'dabke' ? 'smWave .45s cubic-bezier(.45,0,.55,1) infinite' : m === 'kiss' ? 'smKissArm 1.8s cubic-bezier(.2,.8,.2,1) infinite' : m === 'celebrate' ? 'smWave .5s .25s ease-in-out infinite' : 'none'),
