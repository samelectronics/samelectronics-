<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes lnTick{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(var(--tx))}}
@keyframes lnDot{0%,100%{box-shadow:0 0 0 2px #26282B,0 0 0 2px rgba(95,212,154,.5)}50%{box-shadow:0 0 0 2px #26282B,0 0 0 6px rgba(95,212,154,0)}}
@keyframes lnIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div ref="{{ rootRef }}" style="position:fixed;right:24px;bottom:24px;z-index:70">
  <button onClick="{{ click }}" onMouseEnter="{{ poke }}" aria-label="Ask Samsoom" style="position:relative;display:block;height:56px;width:{{ w }}px;padding:0;border:none;border-radius:28px;background:linear-gradient(180deg,#3D3E3F,#26282B);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 1.5px #F7C032,0 12px 30px rgba(26,27,29,.35);cursor:pointer;transition:width .3s cubic-bezier(.2,.8,.2,1),transform .25s cubic-bezier(.2,.8,.2,1)" style-hover="transform:translateY(-2px)">
    <span style="position:absolute;left:4px;top:4px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#FFE58F,#F7C032 65%,#E0A61E);overflow:hidden">
      <span style="position:absolute;left:5px;top:3px;width:38px;height:48px"><dc-import name="SE Samsoom" mood="{{ mood }}" still="{{ still }}" look-x="{{ lx }}" look-y="{{ ly }}" size="38" hint-size="38px,48px"></dc-import></span>
    </span>
    <span style="position:absolute;left:60px;right:18px;top:0;height:56px;display:flex;align-items:center;justify-content:{{ jc }};overflow:hidden;opacity:{{ txtO }};transition:opacity .25s;-webkit-mask-image:{{ mask }};mask-image:{{ mask }}">
      <span key="{{ mi }}" ref="{{ txtRef }}" style="display:inline-block;flex:none;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;color:#FFFFFF;white-space:nowrap;padding:0 {{ padR }}px 0 {{ padL }}px;--tx:{{ tx }}px;animation:{{ tick }}">{{ msg }}</span>
    </span>
  </button>
  <span aria-hidden="true" style="position:absolute;left:40px;top:6px;width:10px;height:10px;border-radius:50%;background:#5FD49A;box-shadow:0 0 0 2px #26282B;animation:{{ dotAnim }};pointer-events:none"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:160},&quot;m0&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ask Samsoom&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;m1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Open till 22:00&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;m2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Need a screen?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;m3&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Trade prices? Ask me&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { mood: 'idle', mi: 0, open: false, tw: 0, lx: 0, ly: 0, cycles: 0 };
  rootRef = React.createRef(); txtRef = React.createRef();
  componentDidMount() {
    this.rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.tm = []; window.__seLauncher = this; this.ign = 0; this.alt = 0;
    if (this.rm) this.setState({ mood: 'happy', open: true });
    else {
      this.later(1200, () => this.cycle());
      this.mm = (e) => { if (this.state.mood !== 'idle') return; const n = performance.now(); if (n - (this._t || 0) < 90) return; this._t = n; const r = this.rootRef.current && this.rootRef.current.getBoundingClientRect(); if (!r) return; const cl = (v) => Math.max(-1, Math.min(1, v)); const lx = Math.round(cl((e.clientX - (r.left + 28)) / 420) * 10) / 10, ly = Math.round(cl((e.clientY - (r.top + 28)) / 420) * 10) / 10; if (lx !== this.state.lx || ly !== this.state.ly) this.setState({ lx, ly }); };
      window.addEventListener('mousemove', this.mm, { passive: true });
    }
    this.measure();
  }
  componentWillUnmount() { this.tm.forEach(clearTimeout); window.removeEventListener('mousemove', this.mm); }
  componentDidUpdate() { this.measure(); }
  later(d, f) { this.tm.push(setTimeout(f, d)); }
  msgs() { const p = this.props; return [p.m0 || 'Ask Samsoom', p.m1 || 'Open till 22:00', p.m2 || 'Need a screen?', p.m3 || 'Trade prices? Ask me', p.m4 || 'Track my order']; }
  // one cycle ≈ 17s: wave+smile (circle) → "Ask Samsoom" → collapse + blink → a page message → collapse → one short emote → next. After 3 ignored cycles it rests.
  cycle() {
    if (this.ign >= 3) { this.setState({ open: false, mood: 'idle' }); return; }
    const sub = 1 + (this.alt++ % 4);
    this.setState({ mood: 'wave', open: false });
    this.later(1300, () => this.setState({ mood: 'happy' }));
    this.later(1900, () => this.setState({ mood: 'idle', mi: 0, open: true }));
    this.later(5900, () => this.setState({ open: false, mood: 'blink' }));
    this.later(7300, () => this.setState({ mood: 'idle', mi: sub, open: true }));
    this.later(11800, () => this.setState({ open: false }));
    this.later(13600, () => { const E = ['dabke', 'kiss', 'happy'].filter((k) => k !== this._last), m = E[Math.floor(Math.random() * E.length)]; this._last = m; this.setState({ mood: m }); this.later(1200, () => this.setState({ mood: 'idle' })); });
    this.later(17000, () => { this.ign++; this.cycle(); });
  }
  wake() { if (this.ign >= 3) { this.ign = 0; this.tm.forEach(clearTimeout); this.tm = []; this.cycle(); } else this.ign = 0; }
  measure() { const el = this.txtRef.current; if (!el) return; const w = Math.ceil(el.scrollWidth); if (w && w !== this.state.tw) this.setState({ tw: w }); }
  renderVals() {
    const s = this.state, MAXT = 280 - 60 - 16, msg = this.msgs()[s.mi], tw = s.tw || msg.length * 8.2, over = tw > MAXT;
    const w = s.open ? Math.round(60 + Math.min(tw, MAXT) + 18) : 56;
    const dur = Math.max(4, (tw - MAXT) / 28 + 3);
    return {
      rootRef: this.rootRef, txtRef: this.txtRef, click: () => { this.wake(); this.props.onOpen && this.props.onOpen(); }, poke: () => this.wake(), jc: over ? 'flex-start' : 'center', mood: s.mood, still: !!this.rm, lx: s.lx, ly: s.ly,
      w, msg, mi: s.mi, txtO: s.open ? 1 : 0,
      padL: over ? 10 : 0, padR: over ? 14 : 0, tx: over ? -(tw - MAXT) : 0, tick: over && s.open && !this.rm ? 'lnTick ' + dur.toFixed(1) + 's linear .6s infinite' : 'lnIn .3s cubic-bezier(.2,.8,.2,1) both',
      mask: over ? 'linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 14px),transparent)' : 'none',
      dotAnim: this.rm ? 'none' : 'lnDot 2.2s cubic-bezier(.45,0,.55,1) infinite'
    };
  }
}
</script>
</body>
</html>
