<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sam Electronics · Worldwide network map</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<script src="se-data.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@600&display=swap">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
svg{display:block;width:100%;height:100%}
.land{fill:url(#dots);stroke:rgba(255,255,255,.07);stroke-width:.6}
.served{fill:rgba(247,192,50,.16);stroke:rgba(247,192,50,.55);stroke-width:.8;transition:fill .5s,stroke .5s,opacity .5s}
.served.dim{fill:rgba(247,192,50,.04);stroke:rgba(247,192,50,.18)}
.route{fill:none;stroke:rgba(247,192,50,.28);stroke-width:1.2;transition:opacity .5s}
.packet{fill:none;stroke:#FFDB6E;stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 0 4px #F7C032);animation:flow linear infinite;transition:opacity .5s}
.pin{fill:#F7C032;transition:opacity .5s}
.halo{fill:none;stroke:#F7C032;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite;transition:opacity .5s}
.dim{opacity:.12}
.lbl{font:600 11px 'JetBrains Mono',monospace;fill:#E4E5E7;letter-spacing:.06em;paint-order:stroke;stroke:#1A1B1D;stroke-width:3px;transition:opacity .5s}
.hub{font:600 15px 'Space Grotesk',sans-serif;fill:#FFFFFF;paint-order:stroke;stroke:#1A1B1D;stroke-width:4px}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>
<svg id="map" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet">
  <defs>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.25" fill="rgba(201,203,206,.38)"></circle></pattern>
    <radialGradient id="hubGlow"><stop offset="0" stop-color="rgba(247,192,50,.55)"></stop><stop offset="1" stop-color="rgba(247,192,50,0)"></stop></radialGradient>
  </defs>
  <g id="g"></g>
</svg>
<script>
(async function () {
  const D = window.SE_DATA, W = 1200, H = 620;
  const topo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')).json();
  const world = topojson.feature(topo, topo.objects.countries);
  const frame = { type: 'MultiPoint', coordinates: [[-18, 62], [92, 62], [-18, -6], [92, -6]] };
  const proj = d3.geoNaturalEarth1().fitExtent([[20, 20], [W - 20, H - 20]], frame);
  const path = d3.geoPath(proj), g = d3.select('#g');
  const served = new Map(D.countries.map((c) => [c.geo, c]));
  g.selectAll('path.land').data(world.features).join('path').attr('class', 'land').attr('d', path);
  const sv = world.features.filter((f) => served.has(f.properties.name));
  g.selectAll('path.served').data(sv).join('path').attr('class', 'served').attr('d', path).attr('data-r', (f) => served.get(f.properties.name).region);
  const dubai = proj([55.3, 25.27]);
  const special = { Russia: [44, 56], 'United Arab Emirates': null };
  const pts = sv.filter((f) => f.properties.name !== 'United Arab Emirates').map((f) => {
    const c = served.get(f.properties.name); const ll = special[f.properties.name] || d3.geoCentroid(f); const p = proj(ll);
    return { name: c.name, region: c.region, x: p[0], y: p[1] };
  });
  const arc = (p) => { const mx = (dubai[0] + p.x) / 2, my = (dubai[1] + p.y) / 2, dx = p.x - dubai[0], dy = p.y - dubai[1], len = Math.hypot(dx, dy) || 1, lift = Math.min(120, len * 0.28); return `M${dubai[0]},${dubai[1]} Q${mx + (dy / len) * lift * -1},${my + (dx / len) * lift * 1 - lift * 0.6} ${p.x},${p.y}`; };
  const rg = g.append('g');
  pts.forEach((p, i) => {
    const grp = rg.append('g').attr('class', 'rt').attr('data-r', p.region);
    grp.append('path').attr('class', 'route').attr('d', arc(p));
    grp.append('path').attr('class', 'packet').attr('d', arc(p)).attr('pathLength', 1000).attr('stroke-dasharray', '26 974').style('animation-duration', (2.6 + (i % 7) * 0.45) + 's').style('animation-delay', (-(i * 0.37)) + 's');
    grp.append('circle').attr('class', 'halo').attr('cx', p.x).attr('cy', p.y).attr('r', 4).style('animation-delay', (i * 0.21) + 's');
    grp.append('circle').attr('class', 'pin').attr('cx', p.x).attr('cy', p.y).attr('r', 3.6);
    const OFF = { Lebanon: [-8, -6, 'end'], Syria: [8, -10, 'start'], Iraq: [9, 12, 'start'], Jordan: [-8, 12, 'end'], 'Saudi Arabia': [-12, 18, 'end'], Kuwait: [8, -6, 'start'], Qatar: [-8, 10, 'end'], Bahrain: [-8, -4, 'end'], Oman: [8, 14, 'start'], Yemen: [8, 16, 'start'], Palestine: [-8, 4, 'end'], Israel: [-8, 4, 'end'] }, o = OFF[p.name] || [7, 4, 'start'];
    grp.append('text').attr('class', 'lbl').attr('x', p.x + o[0]).attr('y', p.y + o[1]).attr('text-anchor', o[2]).text(p.name.toUpperCase());
  });
  (function(){ const kept = []; rg.selectAll('text.lbl').each(function(){ const el = this; let ok = false; for (const dy of [0, 12, -12, 22]) { if (dy) el.setAttribute('y', +el.getAttribute('y') + dy - (el._dy || 0)); el._dy = dy; const b = el.getBBox(); if (!kept.some((q) => b.x < q.x + q.width + 3 && b.x + b.width + 3 > q.x && b.y < q.y + q.height && b.y + b.height > q.y)) { kept.push(b); ok = true; break; } } if (!ok) el.style.display = 'none'; }); })();
    g.append('circle').attr('cx', dubai[0]).attr('cy', dubai[1]).attr('r', 60).attr('fill', 'url(#hubGlow)');
  g.append('circle').attr('class', 'halo').attr('cx', dubai[0]).attr('cy', dubai[1]).attr('r', 8);
  g.append('circle').attr('cx', dubai[0]).attr('cy', dubai[1]).attr('r', 8).attr('fill', '#F7C032').attr('stroke', '#1A1B1D').attr('stroke-width', 2.5);
  g.append('text').attr('class', 'hub').attr('x', dubai[0] + 16).attr('y', dubai[1] + 5).text('Dubai · Deira');
  const setRegion = (r) => {
    document.querySelectorAll('[data-r]').forEach((el) => { const on = r === 'all' || el.getAttribute('data-r') === r; el.classList.toggle('dim', !on); });
  };
  window.addEventListener('message', (e) => { if (e.data && e.data.type === 'se-region') setRegion(e.data.region); });
  const q = new URLSearchParams(location.search).get('region'); if (q) setRegion(q);
  parent.postMessage({ type: 'se-map-ready' }, '*');
})();
</script>
</body>
</html>
