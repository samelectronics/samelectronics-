<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const P = new URLSearchParams(location.search), tier = P.get('t') || 'gold', SZ = +(P.get('s') || 512);
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(SZ, SZ); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(), pm = new THREE.PMREMGenerator(r);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.03).texture;
const cam = new THREE.PerspectiveCamera(22, 1, 0.1, 100); cam.position.set(0, 1.2, 9.4); cam.lookAt(0, 0, 0);
// height map for the face: brushed field, a stamped ring, the two phones of our logo and the banner
const N = 1024, cv = document.createElement('canvas'); cv.width = cv.height = N; const g = cv.getContext('2d');
g.fillStyle = '#000'; g.fillRect(0, 0, N, N); const c = N / 2;

g.strokeStyle = '#fff'; g.lineWidth = N * 0.04; g.beginPath(); g.arc(c, c, N * 0.45, 0, Math.PI * 2); g.stroke(); // raised ring
for (let i = 0; i < 64; i++) { const a = i / 64 * Math.PI * 2; g.save(); g.translate(c + Math.cos(a) * N * 0.395, c + Math.sin(a) * N * 0.395); g.rotate(a); g.fillStyle = '#fff'; g.fillRect(-5, -5, 10, 10); g.restore(); } // bead ring
g.lineWidth = 20; g.strokeStyle = '#fff';
rr(c - 175, c - 205, 190, 360, 30); g.stroke();
g.fillStyle = '#000'; rr(c - 10, c - 150, 175, 305, 28); g.fill(); g.strokeStyle = '#fff'; rr(c - 10, c - 150, 175, 305, 28); g.stroke();
g.lineWidth = 10; g.beginPath(); g.arc(c - 80, c + 115, 15, 0, 7); g.stroke(); g.beginPath(); g.arc(c + 77, c + 115, 13, 0, 7); g.stroke();
g.fillStyle = '#fff'; g.beginPath(); g.moveTo(c - 300, c - 40); g.lineTo(c + 300, c - 40); g.lineTo(c + 270, c + 20); g.lineTo(c + 300, c + 80); g.lineTo(c - 300, c + 80); g.lineTo(c - 270, c + 20); g.closePath(); g.fill();
g.fillStyle = '#000'; g.font = '800 78px Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('SAM', c, c + 22);
const blur = document.createElement('canvas'); blur.width = blur.height = N; const bg = blur.getContext('2d'); bg.filter = 'blur(3px)'; bg.drawImage(cv, 0, 0);
const bump = new THREE.CanvasTexture(blur);
// brushed (concentric) roughness
const rc = document.createElement('canvas'); rc.width = rc.height = N; const rg = rc.getContext('2d'); rg.fillStyle = '#6a6a6a'; rg.fillRect(0, 0, N, N);
for (let i = 0; i < 2400; i++) { const rad = Math.random() * N * 0.5; rg.strokeStyle = 'rgba(' + (Math.random() < .5 ? '255,255,255' : '0,0,0') + ',' + (0.025 + Math.random() * 0.04) + ')'; rg.lineWidth = 1; rg.beginPath(); rg.arc(c, c, rad, 0, 7); rg.stroke(); }
const rough = new THREE.CanvasTexture(rc);
const M = { gold: [0xF5C66A, 0.34], silver: [0xF0F2F4, 0.32], bronze: [0xD08A55, 0.38], off: [0x3A3D42, 0.55] }[tier];
const face = new THREE.MeshPhysicalMaterial({ color: M[0], metalness: tier === 'off' ? 0.35 : 1, roughness: M[1], roughnessMap: rough, envMapIntensity: tier === 'off' ? 1.1 : 2.4, bumpMap: bump, bumpScale: tier === 'off' ? 2 : 2.6, clearcoat: tier === 'off' ? 0 : 0.35, clearcoatRoughness: 0.18 });
// edge: milled (reeded)
const ec = document.createElement('canvas'); ec.width = 2048; ec.height = 32; const eg = ec.getContext('2d'); eg.fillStyle = '#000'; eg.fillRect(0, 0, 2048, 32); eg.fillStyle = '#fff'; for (let x = 0; x < 2048; x += 16) eg.fillRect(x, 0, 8, 32);
const eb = new THREE.CanvasTexture(ec); eb.wrapS = THREE.RepeatWrapping;
const edge = new THREE.MeshPhysicalMaterial({ color: M[0], metalness: tier === 'off' ? 0.35 : 1, roughness: M[1] + 0.05, envMapIntensity: 2.4, bumpMap: eb, bumpScale: 2 });

const side = new THREE.Mesh(new THREE.CylinderGeometry(R, R, T, 256, 1, true), edge); side.rotation.x = Math.PI / 2; coin.add(side);

const prof = [new THREE.Vector2(R, 0), new THREE.Vector2(R - 0.03, 0.035), new THREE.Vector2(R - 0.09, 0.05)];
const lg = mergeVertices(new THREE.LatheGeometry(prof, 256).deleteAttribute('uv'), 1e-4); lg.computeVertexNormals(); const bev = new THREE.Mesh(lg, edge); bev.rotation.x = Math.PI / 2; bev.rotation.y = 2.4; bev.position.z = T / 2; coin.add(bev);
const back = bev.clone(); back.rotation.x = -Math.PI / 2; back.position.z = -T / 2; coin.add(back);
const disc = new THREE.Mesh(new THREE.CircleGeometry(R - 0.09, 256), face); disc.position.z = T / 2 + 0.05; coin.add(disc);
coin.rotation.set(-0.38, -0.32, 0.04); scene.add(coin);
const key = new THREE.DirectionalLight(0xffffff, 3.2); key.position.set(-2, 3, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 1.2); rim.position.set(4, -2, 3); scene.add(rim); const fill = new THREE.PointLight(0xffffff, 40, 0, 2); fill.position.set(0.5, 1.5, 4.5); scene.add(fill);

</script></body></html>
