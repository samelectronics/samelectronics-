<!doctype html>
<!-- R6 §12 · the Pallet Builder in real 3D: a wooden pallet (grain, finished on every side), the shipping carton (kraft
     with the Sam Electronics tape and a printed label) and the full wrapped pallet, from one isometric (orthographic)
     camera. ?layer=<pallet|carton|full>&w=<px>. window.__cells = where each of the 18 cartons lands (px) + draw order. -->
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const Q = new URLSearchParams(location.search), LAYER = Q.get('layer') || 'full', W = +(Q.get('w') || 900), H = Math.round(W * 0.84);
const PI = Math.PI;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(0, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.5;
const S = 1.0; const cam = new THREE.OrthographicCamera(-S * W / H, S * W / H, S, -S, 0.1, 50);
cam.position.set(5.2, 4.4, 6.4); cam.lookAt(0.12, 0.55, 0); cam.updateMatrixWorld(); cam.updateProjectionMatrix();
const key = new THREE.DirectionalLight(0xfff1dc, 2.4); key.position.set(-3, 8, 4); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 5; key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 20 }); scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8478, 0.45));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.35 })); floor.rotation.x = -PI / 2; floor.receiveShadow = true;
const cv = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); draw(x, w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
let sd = 11; const rnd = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
// ---------- wood ----------
const wood = (w, h, tone) => cv(w, h, (x) => { x.fillStyle = tone; x.fillRect(0, 0, w, h); for (let i = 0; i < 70; i++) { x.strokeStyle = `rgba(${90 + rnd() * 40},${55 + rnd() * 30},${20 + rnd() * 20},${0.12 + rnd() * 0.2})`; x.lineWidth = 0.6 + rnd() * 1.8; x.beginPath(); const y0 = rnd() * h; x.moveTo(0, y0); for (let k = 0; k <= w; k += 20) x.lineTo(k, y0 + Math.sin(k / (40 + rnd() * 30) + i) * (2 + rnd() * 3)); x.stroke(); } for (let i = 0; i < 3; i++) { const kx = rnd() * w, ky = rnd() * h; const g = x.createRadialGradient(kx, ky, 0, kx, ky, 10 + rnd() * 8); g.addColorStop(0, 'rgba(80,45,15,.6)'); g.addColorStop(1, 'rgba(80,45,15,0)'); x.fillStyle = g; x.beginPath(); x.ellipse(kx, ky, 18, 8, 0, 0, 7); x.fill(); } });
const woodMat = (tone) => { const t = wood(512, 128, tone); return new THREE.MeshStandardMaterial({ map: t, color: 0xd9c2a2, roughness: 0.82 }); };
const board = (w, h, d, tone) => { const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, 0.006), woodMat(tone)); m.castShadow = true; m.receiveShadow = true; return m; };
// a 1.8 × 0.86 pallet: 3 bottom boards, 9 blocks, 3 stringer boards, 7 top deck boards (finished on every side)
const PW = 1.8, PD = 0.86, PH = 0.16;
const pallet = new THREE.Group();
[-0.36, 0, 0.36].forEach((z) => { const b = board(PW, 0.022, 0.13, '#b88a55'); b.position.set(0, 0.011, z); pallet.add(b); });
[-0.8, 0, 0.8].forEach((x) => [-0.36, 0, 0.36].forEach((z) => { const b = board(0.14, 0.085, 0.12, '#a77a45'); b.position.set(x, 0.022 + 0.0425, z); pallet.add(b); }));
[-0.36, 0, 0.36].forEach((z) => { const b = board(PW, 0.022, 0.13, '#c09060'); b.position.set(0, 0.107 + 0.011, z); pallet.add(b); });
for (let i = 0; i < 7; i++) { const b = board(0.22, 0.022, PD, ['#c99a62', '#bf8f58', '#d1a46c'][i % 3]); b.position.set(-PW / 2 + 0.11 + i * ((PW - 0.22) / 6), 0.129 + 0.011, 0); pallet.add(b); }
// burnt-in IPPC mark on a block
// ---------- the carton: kraft, Sam Electronics tape, label ----------
const CW = 0.58, CD = 0.4, CH = 0.36;
const kraftSide = (label) => cv(512, 320, (x, w, h) => { x.fillStyle = '#c8995d'; x.fillRect(0, 0, w, h); const id = x.getImageData(0, 0, w, h), d = id.data; for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * 16; d[i] += n; d[i + 1] += n * 0.9; d[i + 2] += n * 0.7; } x.putImageData(id, 0, 0); x.fillStyle = 'rgba(90,55,20,.06)'; for (let i = 0; i < w; i += 6) x.fillRect(i, 0, 2, h);
  x.fillStyle = '#F7C032'; x.fillRect(w * 0.42, 0, w * 0.16, 62); // tape over the top edge
  if (label) { x.fillStyle = '#f7f5ef'; x.fillRect(28, h - 128, 200, 104); x.fillStyle = '#111'; let r = 5; for (let i = 40; i < 210; ) { r = (r * 9301 + 49297) % 233280; const bw = 1 + (r % 4); if ((r >> 3) % 2) x.fillRect(i, h - 116, bw, 38); i += bw + 1 + ((r >> 5) % 3); } x.font = 'bold 15px Arial'; x.fillText('SE-2611 · DXB', 40, h - 56); x.font = '12px Arial'; x.fillText('MOBILE PARTS · 1 CTN', 40, h - 36);
    x.strokeStyle = '#26282B'; x.lineWidth = 3; x.beginPath(); x.arc(w - 70, h - 70, 30, 0, 7); x.stroke(); x.fillStyle = '#26282B'; x.font = 'bold 15px Arial'; x.textAlign = 'center'; x.fillText('SE', w - 70, h - 64); x.textAlign = 'left'; x.font = 'bold 13px Arial'; x.fillText('SAM ELECTRONICS', w - 190, h - 18);
    x.strokeStyle = '#3a2a18'; x.lineWidth = 2.5; [[w - 150, 40], [w - 120, 40]].forEach(([a, b]) => { x.beginPath(); x.moveTo(a, b + 30); x.lineTo(a, b); x.moveTo(a - 8, b + 8); x.lineTo(a, b); x.lineTo(a + 8, b + 8); x.stroke(); }); } });
const kraftTop = cv(512, 360, (x, w, h) => { x.fillStyle = '#cfa266'; x.fillRect(0, 0, w, h); const id = x.getImageData(0, 0, w, h), d = id.data; for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * 14; d[i] += n; d[i + 1] += n * 0.9; d[i + 2] += n * 0.7; } x.putImageData(id, 0, 0); x.fillStyle = 'rgba(80,50,20,.25)'; x.fillRect(0, h / 2 - 1, w, 2);
  const g = x.createLinearGradient(0, 0, w, 0); g.addColorStop(0, '#F2B92A'); g.addColorStop(0.5, '#FFD45C'); g.addColorStop(1, '#F2B92A'); x.fillStyle = g; x.fillRect(0, h / 2 - 46, w, 92); x.fillStyle = '#26282B'; x.font = 'bold 26px Arial'; x.textAlign = 'center'; x.fillText('SAM ELECTRONICS · QUALITY · WARRANTY · PRICE', w / 2, h / 2 + 9); x.fillStyle = 'rgba(255,255,255,.25)'; x.fillRect(0, h / 2 - 46, w, 10); });
const carton = () => { const mats = [new THREE.MeshStandardMaterial({ map: kraftSide(false), roughness: 0.9 }), new THREE.MeshStandardMaterial({ map: kraftSide(false), roughness: 0.9 }), new THREE.MeshPhysicalMaterial({ map: kraftTop, roughness: 0.75, clearcoat: 0.25, clearcoatRoughness: 0.4 }), new THREE.MeshStandardMaterial({ color: 0xb08050 }), new THREE.MeshStandardMaterial({ map: kraftSide(true), roughness: 0.9 }), new THREE.MeshStandardMaterial({ map: kraftSide(false), roughness: 0.9 })];
  const m = new THREE.Mesh(new RoundedBoxGeometry(CW, CH, CD, 3, 0.012), mats); m.castShadow = true; m.receiveShadow = true; return m; };
// stack grid: 3 columns (x) × 2 rows (z) × 3 layers (y)
const cellPos = (c, r, l) => new THREE.Vector3(-PW / 2 + 0.31 + c * 0.59, PH + CH / 2 + l * (CH + 0.004), -0.21 + r * 0.42);
const film = () => { const g = new THREE.BoxGeometry(PW + 0.03, 3 * (CH + 0.004) + 0.02, PD + 0.03, 1, 6, 1); const p = g.attributes.position; for (let i = 0; i < p.count; i++) { const y = p.getY(i); p.setX(i, p.getX(i) * (1 + 0.012 * Math.cos(y * 9))); p.setZ(i, p.getZ(i) * (1 + 0.02 * Math.cos(y * 9))); } g.computeVertexNormals();
  const t = cv(256, 512, (x, w, h) => { x.fillStyle = 'rgba(255,255,255,.12)'; x.fillRect(0, 0, w, h); for (let i = 0; i < 40; i++) { x.fillStyle = `rgba(255,255,255,${0.05 + rnd() * 0.12})`; const y = rnd() * h; x.fillRect(0, y, w, 1 + rnd() * 5); } x.strokeStyle = 'rgba(255,255,255,.18)'; for (let i = 0; i < 14; i++) { x.beginPath(); x.moveTo(0, i * 38); x.bezierCurveTo(w * 0.3, i * 38 + 10, w * 0.7, i * 38 - 10, w, i * 38 + 4); x.stroke(); } });
  const m = new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({ map: t, color: 0xffffff, transparent: true, opacity: 0.55, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05, depthWrite: false, side: THREE.DoubleSide }));
  m.position.set(0, PH + (3 * (CH + 0.004)) / 2 + 0.005, 0); return m; };
// ---------- layers ----------
scene.add(floor);
if (LAYER === 'pallet') scene.add(pallet);
if (LAYER === 'carton') { const c = carton(); c.position.copy(cellPos(0, 0, 0)); scene.add(c); }
if (LAYER === 'full') { scene.add(pallet); for (let l = 0; l < 3; l++) for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) { const m = carton(); m.position.copy(cellPos(c, r, l)); scene.add(m); } scene.add(film()); }
if (LAYER === 'single') { const c = carton(); c.position.set(0, CH / 2, 0); c.rotation.y = -0.2; scene.add(c); cam.lookAt(0, 0.2, 0); }
renderer.render(scene, cam);
// where each carton lands relative to cell (0,0,0), in canvas px, and the draw order (far → near, low → high)
const px = (v) => { const p = v.clone().project(cam); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H, p.z]; };
const o = px(cellPos(0, 0, 0)), cells = [];
for (let l = 0; l < 3; l++) for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) { const q = px(cellPos(c, r, l)); const camD = cellPos(c, r, l).distanceTo(cam.position); cells.push({ c, r, l, dx: +(q[0] - o[0]).toFixed(2), dy: +(q[1] - o[1]).toFixed(2), d: camD }); }
window.__cells = cells; window.__done = true;
</script>
</body>
</html>
