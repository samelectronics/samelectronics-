<!doctype html>
<!-- R6 Part E7 · the product shot: the real box on the left, the LCD to its right, one studio. Rendered once per box + LCD
     pairing by scripts/productshot/render.mjs into cached images (public/assets/shots). Never mirrored, same pose everywhere.
     ?box=<design>&lcd=<iphone|plain|frame|tabs>&label=<text>&w=<px> -->
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const Q = new URLSearchParams(location.search);
const BOX = Q.get('box') || 'temp', LCD = Q.get('lcd') || 'plain', LABEL = Q.get('label') || '', W = +(Q.get('w') || 960), H = Math.round(W * 0.75);
const PI = Math.PI, deg = (d) => (d * PI) / 180;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.LinearToneMapping; renderer.toneMappingExposure = 0.82; // linear keeps the printed colours true
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new THREE.PerspectiveCamera(24, W / H, 0.1, 50); cam.position.set(0.15, 1.05, 7.4); cam.lookAt(0.12, 0.98, 0);

// light: key from the top-left, soft rim on the right edges, a little fill
const key = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(-2.6, 7.5, 3.6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 9; key.shadow.blurSamples = 20; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 14 }); scene.add(key);
const rim = new THREE.DirectionalLight(0xfff3dc, 1.6); rim.position.set(4, 2.4, -2.6); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8478, 0.55));
// seamless floor: shadow only, so the shot sits on any section background
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.32 }));
floor.rotation.x = -PI / 2; floor.receiveShadow = true; scene.add(floor);

// ---------- printed box faces (canvas, 1px = 0.1mm-ish) ----------
const cv = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); draw(x, w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
const paper = (x, w, h, base, amt = 7) => { x.fillStyle = base; x.fillRect(0, 0, w, h); const id = x.getImageData(0, 0, w, h), d = id.data; for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; } x.putImageData(id, 0, 0); };
const barcode = (x, X, Y, w, h, seed = 7) => { x.fillStyle = '#111'; let r = seed; for (let i = X; i < X + w; ) { r = (r * 9301 + 49297) % 233280; const bw = 1 + Math.floor((r / 233280) * 4); if ((r >> 3) % 2) x.fillRect(i, Y, bw, h); i += bw + 1 + ((r >> 5) % 3); } };
const qr = (x, X, Y, s, seed = 3) => { const n = 21, c = s / n; x.fillStyle = '#111'; let r = seed; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { r = (r * 9301 + 49297) % 233280; if (r % 2) x.fillRect(X + i * c, Y + j * c, c, c); } [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([a, b]) => { x.fillStyle = '#111'; x.fillRect(X + a * c, Y + b * c, 7 * c, 7 * c); x.fillStyle = '#fff'; x.fillRect(X + (a + 1) * c, Y + (b + 1) * c, 5 * c, 5 * c); x.fillStyle = '#111'; x.fillRect(X + (a + 2) * c, Y + (b + 2) * c, 3 * c, 3 * c); }); };
const tiny = (x, X, Y, lines, size = 11, col = '#333', font = 'Arial') => { x.fillStyle = col; x.font = `${size}px ${font}`; lines.forEach((l, i) => x.fillText(l, X, Y + i * size * 1.3)); };
const vtext = (x, t, X, Y, font, col, ang = -PI / 2, ls = 0) => { x.save(); x.translate(X, Y); x.rotate(ang); x.fillStyle = col; x.font = font; if (ls) x.letterSpacing = ls + 'px'; x.fillText(t, 0, 0); x.restore(); };
const rr = (x, X, Y, w, h, r) => { x.beginPath(); x.roundRect(X, Y, w, h, r); };
const label = (x, X, Y, w, h, seed, txt) => { x.save(); x.shadowColor = 'rgba(0,0,0,.18)'; x.shadowBlur = 3; x.fillStyle = '#FBFBF8'; rr(x, X, Y, w, h, 4); x.fill(); x.restore(); barcode(x, X + 14, Y + 12, w * 0.62, h * 0.36, seed); tiny(x, X + 14, Y + h * 0.58, txt, Math.round(h * 0.11), '#222'); };

// front 600x1160 (box w 0.82 × h 1.58), side 120x1160, top 600x120
const DESIGN = {
  // plain white genuine service box, small barcode label (Apple Original · Service Pack)
  'apple-sp': { front: (x, w, h) => { paper(x, w, h, '#F6F6F3'); label(x, w * 0.36, 70, 330, 130, 11, ['661-xxxxx · Display Assembly', 'SERVICE PART · 1 PC']); tiny(x, 40, h - 70, ['Packaging may be recycled'], 13, '#9a9a96'); }, side: (x, w, h) => { paper(x, w, h, '#F1F1EE'); barcode(x, 30, h * 0.7, 60, 140, 4); }, top: '#F3F3F0' },
  // light grey SVC-SEVT box with the Samsung label, QR and GH82 code (vertical, standing)
  'samsung-sp': { front: (x, w, h) => { paper(x, w, h, '#EEF0F3', 5); vtext(x, 'SVC-SEVT', w * 0.83, h * 0.5, 'bold 92px "Times New Roman",serif', '#1d1d1f', PI / 2); x.save(); x.translate(w * 0.16, h * 0.5); x.rotate(PI / 2); x.fillStyle = '#fff'; rr(x, -300, -88, 600, 176, 10); x.fill(); qr(x, -280, -70, 112, 9); barcode(x, -150, -70, 330, 42, 21); tiny(x, -150, -6, ['GH82-25042A    1 PC', 'SVC ASSY LCD-OCTA · SEVT', 'Made in Vietnam'], 18, '#222'); x.restore(); vtext(x, 'SAMSUNG', w * 0.06, h * 0.12, 'bold 16px Arial', '#333', PI / 2, 2); tiny(x, 30, h - 120, ['MIX', 'FSC® C115270', 'Eco Service'], 14, '#555'); }, side: (x, w, h) => { paper(x, w, h, '#E8EAEE', 5); vtext(x, 'SAMSUNG', w * 0.55, h * 0.4, 'bold 22px Arial', '#444', PI / 2, 3); }, top: '#E9EBEF' },
  // the same SVC box with the yellow barcode sticker (Google Pixel, Infinix, Tecno originals)
  'svc-yellow': { front: (x, w, h) => { DESIGN['samsung-sp'].front(x, w, h); x.save(); x.translate(w * 0.38, h * 0.62); x.rotate(PI / 2); x.fillStyle = '#F4E32B'; rr(x, -170, -110, 340, 220, 8); x.fill(); barcode(x, -150, -90, 300, 70, 33); tiny(x, -150, 10, ['SERVICE PART', 'ORIGINAL · 1 PC', 'QC PASSED'], 22, '#222'); x.restore(); }, side: (x, w, h) => DESIGN['samsung-sp'].side(x, w, h), top: '#E9EBEF' },
  // white box, red block, vertical SERVICE PACK (Huawei, Honor)
  'huawei-sp': { front: (x, w, h) => sp(x, w, h, '#E8382F'), side: (x, w, h) => { paper(x, w, h, '#F7F7F5'); x.fillStyle = '#E8382F'; x.fillRect(0, h * 0.62, w, h * 0.38); }, top: '#F5F5F3' },
  // white box, green block (Oppo, Realme, OnePlus, Vivo)
  'bbk-sp': { front: (x, w, h) => sp(x, w, h, '#3EC54A'), side: (x, w, h) => { paper(x, w, h, '#F7F7F5'); x.fillStyle = '#3EC54A'; x.fillRect(0, h * 0.62, w, h * 0.38); }, top: '#F5F5F3' },
  // orange sleeve over a white inner box, thumb cut, vertical SERVICE PACK (Xiaomi, Redmi, POCO)
  'xiaomi-sp': { front: (x, w, h) => { paper(x, w, h, '#FAFAF8'); x.fillStyle = '#FF6A13'; rr(x, w * 0.1, h * 0.06, w * 0.8, h * 0.44, 18); x.fill(); x.fillStyle = '#FAFAF8'; x.beginPath(); x.arc(w * 0.5, h * 0.06, 46, 0, PI); x.fill(); vtext(x, 'SERVICE PACK', w * 0.47, h * 0.62, '600 54px Arial', '#2a2a2a', PI / 2, 3); }, side: (x, w, h) => { paper(x, w, h, '#FF6A13', 4); x.fillStyle = '#FFFFFF'; vtext(x, 'Mi', w * 0.6, h * 0.12, 'bold 30px Arial', '#fff', PI / 2); }, top: '#FF6A13' },
  // black box, gold-orange GX logo, model name, grey diamonds at the bottom
  gx: { front: (x, w, h) => { paper(x, w, h, '#121212', 4); const g = x.createLinearGradient(0, 120, 0, 250); g.addColorStop(0, '#F6B44A'); g.addColorStop(1, '#C8661E'); x.fillStyle = g; x.font = 'bold 150px Arial'; x.fillText('GX', w * 0.3, 260); x.fillStyle = '#E8E8E8'; x.font = '600 50px Arial'; x.textAlign = 'center'; x.fillText(LABEL || 'GX', w / 2, 380); x.textAlign = 'left'; for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) { if ((r * 7 + c * 3) % 5 < 2) continue; const s = 68, X = 40 + c * 92 + (r % 2) * 46, Y = h - 470 + r * 64; x.fillStyle = ['#2c2c2c', '#3a3a3a', '#454545', '#232323'][(r + c) % 4]; x.beginPath(); x.moveTo(X, Y - s / 2); x.lineTo(X + s / 2, Y); x.lineTo(X, Y + s / 2); x.lineTo(X - s / 2, Y); x.fill(); } tiny(x, w - 150, h - 40, ['GX · Display'], 13, '#888'); }, side: (x, w, h) => { paper(x, w, h, '#151515', 3); vtext(x, 'GX', w * 0.62, h * 0.16, 'bold 46px Arial', '#D9832E', PI / 2); }, top: '#141414' },
  // blue gradient box, red ZY tag, IN CELL, big model name
  zy: { front: (x, w, h) => { const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#1FB4F2'); g.addColorStop(0.45, '#1C55E0'); g.addColorStop(1, '#5B2BD6'); x.fillStyle = g; x.fillRect(0, 0, w, h); x.fillStyle = '#E3262B'; x.fillRect(w / 2 - 50, 150, 100, 56); x.fillStyle = '#fff'; x.font = 'bold 40px Arial'; x.textAlign = 'center'; x.fillText('ZY', w / 2, 192); x.font = 'bold 86px Arial'; x.fillText('IN CELL', w / 2, 330); const L2 = LABEL || 'X'; x.font = 'bold 230px Arial'; const fz = Math.min(230, (230 * w * 0.82) / x.measureText(L2).width); x.font = `bold ${fz}px Arial`; x.globalAlpha = 0.92; x.fillText(L2, w / 2, 560 + fz * 0.5); x.globalAlpha = 1; x.textAlign = 'left'; }, side: (x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#1C9AEB'); g.addColorStop(1, '#3B32D8'); x.fillStyle = g; x.fillRect(0, 0, w, h); }, top: '#1D7FE6' },
  // TEMP: neutral white box with a small Sam Electronics label, until the owner sends a photo of this maker's box
  temp: { front: (x, w, h) => { paper(x, w, h, '#F4F4F1'); x.fillStyle = '#fff'; x.save(); x.shadowColor = 'rgba(0,0,0,.15)'; x.shadowBlur = 3; rr(x, w * 0.2, h * 0.36, w * 0.6, 210, 10); x.fill(); x.restore(); x.strokeStyle = '#F7C032'; x.lineWidth = 8; x.beginPath(); x.arc(w * 0.5, h * 0.36 + 70, 42, 0, PI * 2); x.stroke(); x.fillStyle = '#26282B'; x.font = 'bold 26px Arial'; x.textAlign = 'center'; x.fillText('SAM ELECTRONICS', w / 2, h * 0.36 + 150); x.font = '15px Arial'; x.fillText('QUALITY · WARRANTY · PRICE', w / 2, h * 0.36 + 180); x.textAlign = 'left'; barcode(x, w * 0.3, h - 160, 240, 60, 5); }, side: (x, w, h) => paper(x, w, h, '#EFEFEC'), top: '#F1F1EE' },
};
function sp(x, w, h, col) { paper(x, w, h, '#FAFAF8'); x.fillStyle = col; x.fillRect(0, 0, 10, h); x.beginPath(); x.moveTo(0, h * 0.56); x.lineTo(w * 0.78, h * 0.56); x.lineTo(w * 0.78, h * 0.86); x.quadraticCurveTo(w * 0.78, h * 0.92, w * 0.72, h * 0.92); x.lineTo(0, h * 0.92); x.closePath(); x.fill(); vtext(x, 'SERVICE PACK', w * 0.47, h * 0.42, '600 52px Arial', '#2a2a2a', -PI / 2, 3); }

const D = DESIGN[BOX] || DESIGN.temp;
const faceMat = (tex, rough = 0.62) => new THREE.MeshPhysicalMaterial({ map: tex, roughness: rough, clearcoat: BOX === 'gx' || BOX === 'zy' ? 0.5 : 0.25, clearcoatRoughness: 0.35 });
const top = typeof D.top === 'string' ? cv(600, 120, (x, w, h) => paper(x, w, h, D.top)) : cv(600, 120, D.top);
const front = cv(600, 1160, D.front), side = cv(120, 1160, D.side);
const box = new THREE.Mesh(new RoundedBoxGeometry(0.82, 1.58, 0.2, 4, 0.014), [faceMat(side), faceMat(side), faceMat(top), faceMat(top), faceMat(front), faceMat(front)]);
box.castShadow = true; box.position.set(-0.86, 0.79, -0.16); box.rotation.y = deg(-15); scene.add(box);

// ---------- the LCD: glossy black glass, short flex out of the right edge ----------
const lcd = new THREE.Group(); scene.add(lcd);
const LW = 0.86, LH = 1.86, LD = 0.035;
const rshape = (w, h, r) => { const s = new THREE.Shape(), x = -w / 2, y = -h / 2; s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; };
const slab = (w, h, r, d, mat) => { const g = new THREE.ExtrudeGeometry(rshape(w, h, r), { depth: d, bevelEnabled: true, bevelThickness: 0.004, bevelSize: 0.004, bevelSegments: 3, curveSegments: 16 }); g.translate(0, 0, -d / 2); const m = new THREE.Mesh(g, mat); m.castShadow = true; return m; };
const glassTex = cv(512, 1100, (x, w, h) => { const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#16171a'); g.addColorStop(0.5, '#08090a'); g.addColorStop(1, '#111214'); x.fillStyle = g; x.fillRect(0, 0, w, h);
  const sh = x.createLinearGradient(0, 0, w, h * 0.7); sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(0.42, 'rgba(255,255,255,0)'); sh.addColorStop(0.5, 'rgba(255,255,255,.07)'); sh.addColorStop(0.62, 'rgba(255,255,255,0)'); x.fillStyle = sh; x.fillRect(0, 0, w, h);
  if (LCD === 'iphone') { x.fillStyle = '#000'; rr(x, w * 0.3, -20, w * 0.4, 72, 30); x.fill(); x.fillStyle = '#1b2433'; x.beginPath(); x.arc(w * 0.62, 24, 8, 0, PI * 2); x.fill(); }
  else { x.fillStyle = '#000'; x.beginPath(); x.arc(w * 0.5, 46, 16, 0, PI * 2); x.fill(); x.fillStyle = '#1b2433'; x.beginPath(); x.arc(w * 0.5, 46, 7, 0, PI * 2); x.fill(); } });
glassTex.repeat.set(1 / LW, 1 / LH); glassTex.offset.set(0.5, 0.5);
const glass = new THREE.MeshPhysicalMaterial({ map: glassTex, color: 0xffffff, roughness: 0.06, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.03, reflectivity: 0.6, envMapIntensity: 1.6 });
const back = new THREE.MeshStandardMaterial({ color: 0x2b2b2d, roughness: 0.55, metalness: 0.2 });
const panel = slab(LW, LH, LCD === 'iphone' ? 0.11 : 0.08, LD, [glass, back]); lcd.add(panel);
if (LCD === 'frame') { // the part's own mid-frame (Samsung / Google / Infinix / Tecno originals with frame)
  const fr = slab(LW + 0.07, LH + 0.07, 0.1, LD * 0.9, new THREE.MeshStandardMaterial({ color: 0x3a3c40, roughness: 0.35, metalness: 0.8 })); fr.position.z = -LD * 0.9; lcd.add(fr);
  [[LW / 2 + 0.035, 0.42, 0.18], [LW / 2 + 0.035, 0.12, 0.26]].forEach(([x, y, h]) => { const b = new THREE.Mesh(new THREE.BoxGeometry(0.014, h, 0.02), fr.material); b.position.set(x, y, -LD * 0.6); lcd.add(b); });
}
if (LCD === 'tabs') { // the red pull-tabs of the protective film (Huawei / Honor)
  const red = new THREE.MeshStandardMaterial({ color: 0xe8382f, roughness: 0.6 });
  [-0.3, 0, 0.3].forEach((x) => { const t = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.004), red); t.position.set(x * 0.6 + 0.12, LH / 2 + 0.04, LD / 2 + 0.003); lcd.add(t); });
  const t = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.05, 0.004), red); t.position.set(-LW / 2 - 0.05, -LH * 0.32, LD / 2 + 0.003); lcd.add(t);
}
// flex: a short ribbon leaving the right edge, curving gently down-right, ending in its connector
{ const pts = [new THREE.Vector3(LW / 2 - 0.02, -0.18, -LD / 2 - 0.004), new THREE.Vector3(LW / 2 + 0.12, -0.22, -LD / 2 - 0.01), new THREE.Vector3(LW / 2 + 0.22, -0.34, -LD / 2 - 0.006), new THREE.Vector3(LW / 2 + 0.26, -0.5, -LD / 2)];
  const cur = new THREE.CatmullRomCurve3(pts), N = 40, wd = 0.11, pos = [], idx = [];
  for (let i = 0; i <= N; i++) { const p = cur.getPoint(i / N), t = cur.getTangent(i / N), n = new THREE.Vector3(-t.y, t.x, 0).normalize().multiplyScalar(wd / 2); pos.push(p.x + n.x, p.y + n.y, p.z, p.x - n.x, p.y - n.y, p.z); if (i < N) idx.push(i * 2, i * 2 + 1, i * 2 + 2, i * 2 + 1, i * 2 + 3, i * 2 + 2); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const flex = new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({ color: 0xc9781d, roughness: 0.35, metalness: 0.25, clearcoat: 0.6, side: THREE.DoubleSide })); flex.castShadow = true; lcd.add(flex);
  const end = cur.getPoint(1), con = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.08, 0.022), new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.4, metalness: 0.5 })); con.position.copy(end).add(new THREE.Vector3(0, -0.04, 0)); con.castShadow = true; lcd.add(con);
  const pins = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.02, 0.024), new THREE.MeshStandardMaterial({ color: 0xd4a640, roughness: 0.25, metalness: 1 })); pins.position.copy(con.position).add(new THREE.Vector3(0, -0.035, 0)); lcd.add(pins); }
// pose: in front of the box, overlapping its right edge ~10%, turned ~25° to the right, tilted back ~5°
lcd.position.set(0.02, LH / 2 + 0.005, 0.16); lcd.rotation.set(deg(-5), deg(25), 0);
lcd.traverse((m) => { if (m.isMesh) m.castShadow = true; });
// tilting back lifts the bottom edge off the floor: settle it
lcd.updateMatrixWorld(true); { const bb = new THREE.Box3().setFromObject(panel); lcd.position.y -= bb.min.y; }

renderer.render(scene, cam);
window.__done = true;
</script>
</body>
</html>
