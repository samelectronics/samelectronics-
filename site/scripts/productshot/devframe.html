<!doctype html>
<html>
<!-- Owner (15 Nov): the Bench Test rig plate, rendered as real metal (not CSS gradients): a machined slab of brushed
     aluminium with polished chamfers on the outer edge and on every pocket (top display, phone bay, the four readouts,
     the cable slot), four countersunk Phillips screws. Straight-on, transparent, pixel-aligned with the HTML panels
     (geometry in CSS px from the live rig: 620 × 616). The HTML panels sit inside the pockets. -->
<head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
const Q = new URLSearchParams(location.search), K = +(Q.get('k') || 3); // px scale
const DW = +Q.get('w'), DH = +Q.get('h'), DR = +Q.get('r'), IN = +Q.get('in'), PAD = 6, RW = DW + PAD * 2, RH = DH + PAD * 2, W = RW * K, H = RH * K;
const BTN = JSON.parse(Q.get('btn') || '[]'); // [side 'l'|'r'|'t', start px, length px]
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.85;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
// the same studio as the product shots: big softbox top-left, warm strip lights, a softbox behind the camera
{ const pmrem = new THREE.PMREMGenerator(renderer), env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(30, 32, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.22, 0.225, 0.235), side: THREE.BackSide })));
  const panel = (w, h, rgb, pos) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(...rgb), side: THREE.DoubleSide })); m.position.set(...pos); m.lookAt(0, 0, 0); env.add(m); };
  panel(12, 7, [5.5, 5.5, 5.4], [-8, 9, 10]);   // key softbox, top-left
  panel(4, 12, [1.6, 1.6, 1.65], [11, -1, 7]);  // fill, right
  panel(1.4, 16, [3.4, 3.0, 2.4], [-3, 0, 14]); // warm strip light: the vertical sheen band
  panel(18, 3, [0.7, 0.7, 0.72], [0, -11, 6]);  // floor bounce
  panel(30, 14, [1.05, 1.06, 1.1], [-2, 5, 22]); // big softbox behind the camera (what flat metal mirrors)
  panel(30, 6, [0.3, 0.3, 0.32], [2, -9, 20]);  // darker lower half: a real gradient across the plate
  panel(2.2, 30, [2.2, 2.1, 1.95], [5, 0, 21]);   // a strip light: the soft vertical sheen band
  scene.environment = pmrem.fromScene(env, 0.035).texture; }
scene.add(new THREE.HemisphereLight(0xffffff, 0x404246, 0.15));
const key = new THREE.DirectionalLight(0xffffff, 0.7); key.position.set(-4, 6, 8); scene.add(key);

const X = (px) => px - RW / 2, Y = (py) => RH / 2 - py;
const rrect = (path, x, y, w, h, r) => { const l = X(x), t = Y(y), rr = Math.min(r, w / 2, h / 2), b = t - h, ri = l + w, H2 = Math.PI / 2;
  path.moveTo(l + rr, t); path.lineTo(ri - rr, t); path.absarc(ri - rr, t - rr, rr, H2, 0, true); path.lineTo(ri, b + rr); path.absarc(ri - rr, b + rr, rr, 0, -H2, true);
  path.lineTo(l + rr, b); path.absarc(l + rr, b + rr, rr, -H2, -Math.PI, true); path.lineTo(l, t - rr); path.absarc(l + rr, t - rr, rr, Math.PI, H2, true); return path; };
// the titanium band: the whole rim is one rolled bevel, so light runs along it like on a real phone edge
const BV = IN * 0.62;
const shape = rrect(new THREE.Shape(), PAD + BV, PAD + BV, DW - 2 * BV, DH - 2 * BV, DR - BV);
shape.holes.push(rrect(new THREE.Path(), PAD + IN, PAD + IN, DW - 2 * IN, DH - 2 * IN, DR - IN));
const geo = new THREE.ExtrudeGeometry(shape, { depth: 8, bevelEnabled: true, bevelThickness: BV * 0.9, bevelSize: BV, bevelSegments: 10, curveSegments: 64 });
geo.translate(0, 0, -8);
let sd = 5; const rnd = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
const grain = (() => { const c = document.createElement('canvas'); c.width = 1024; c.height = 1024; const x = c.getContext('2d'); x.fillStyle = '#808080'; x.fillRect(0, 0, 1024, 1024); for (let i = 0; i < 20000; i++) { const v = 100 + rnd() * 60 | 0; x.fillStyle = `rgba(${v},${v},${v},.12)`; x.fillRect(rnd() * 1024, rnd() * 1024, 1 + rnd() * 2, 1 + rnd() * 2); } const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.NoColorSpace; return t; })();
const ti = new THREE.MeshPhysicalMaterial({ color: 0x9aa0a6, metalness: 1, roughness: 0.2, roughnessMap: grain, envMapIntensity: 1.6, clearcoat: 0.4, clearcoatRoughness: 0.12 });
scene.add(new THREE.Mesh(geo, ti));
// a thin black glass bezel ring just inside the titanium (every real phone has it)
{ const sh = rrect(new THREE.Shape(), PAD + IN - 0.5, PAD + IN - 0.5, DW - 2 * IN + 1, DH - 2 * IN + 1, DR - IN + 0.5); sh.holes.push(rrect(new THREE.Path(), PAD + IN + 1.6, PAD + IN + 1.6, DW - 2 * IN - 3.2, DH - 2 * IN - 3.2, DR - IN - 1.6));
  const m = new THREE.Mesh(new THREE.ShapeGeometry(sh, 64), new THREE.MeshPhysicalMaterial({ color: 0x050506, roughness: 0.05, clearcoat: 1, envMapIntensity: 1.2 })); m.position.z = -1; scene.add(m); }
// side buttons: machined titanium keys standing just proud of the band
BTN.forEach(([side, a, len]) => { const thick = 2.2, w = side === 't' ? len : thick, h = side === 't' ? thick : len;
  const x = side === 'l' ? PAD - thick + 0.6 : side === 'r' ? PAD + DW - 0.6 : PAD + a, y = side === 't' ? PAD - thick + 0.6 : PAD + a;
  const g = new THREE.ExtrudeGeometry(rrect(new THREE.Shape(), x, y, w, h, 1), { depth: 4, bevelEnabled: true, bevelThickness: 0.8, bevelSize: 0.6, bevelSegments: 4 }); g.translate(0, 0, -6);
  scene.add(new THREE.Mesh(g, ti)); });
const FOV = 24, D = (RH / 2) / Math.tan((FOV * Math.PI / 180) / 2); const cam = new THREE.PerspectiveCamera(FOV, RW / RH, 1, 5000);
cam.position.set(0, 0, D + BV * 0.9); cam.lookAt(0, 0, BV * 0.9);
renderer.render(scene, cam); window.__done = true;
</script>
</body>
</html>
