     · every part is the teardown's own 3D part (scripts/productshot/stack.js, copied from public/se-teardown-3d.js),
       under the teardown's studio light;
     · every screen carton is the owner's real box photo (docs/Round6_Finish_Home.pdf p19–20, cut and squared in
       scripts/productshot/boxes/), on a real 3D box sized to the product (height and width follow the product);
     · every other part stands in front of a plain white carton with a crisp barcode + QR label, sized to that part;
     · one pose for all: product in front, carton behind on the left showing ~70%, both turned 22° right, leaning back
       5°, one key light, one shared soft shadow.

  'huawei-sp': { d: 0.18, side: '#F6F6F4', top: '#F6F6F4', band: '#E8382F' }, 'bbk-sp': { d: 0.18, side: '#F6F6F4', top: '#F6F6F4', band: '#3EC54A' }, 'xiaomi-sp': { d: 0.24, side: '#FF6A13', top: '#FF6A13' },

    faceTex = cv(im.width, im.height, (x, w, h) => { x.drawImage(im, 0, 0, w, h);

      if (BOX === 'zy' && LABEL) { x.save(); x.beginPath(); x.rect(0, h * 0.42, w, h * 0.45); x.clip(); x.filter = 'blur(60px)'; x.drawImage(im, 0, 0, w, h); x.restore(); x.fillStyle = 'rgba(232,236,255,.88)'; x.textAlign = 'center'; let fz = w * 0.36; x.font = `bold ${fz}px Arial`; const tw = x.measureText(LABEL).width; if (tw > w * 0.82) { fz *= (w * 0.82) / tw; x.font = `bold ${fz}px Arial`; } x.fillText(LABEL, w / 2, h * 0.64 + fz * 0.35); } });

    const fw = 900, fh = Math.round(900 / ar);

      x.strokeStyle = '#F7C032'; x.lineWidth = Math.max(5, w * 0.012); x.beginPath(); x.arc(w * 0.16, h * 0.12, Math.min(w, h) * 0.05, 0, 7); x.stroke(); x.fillStyle = '#26282B'; x.font = `bold ${Math.round(Math.min(w, h) * 0.045)}px Arial`; x.fillText('SAM ELECTRONICS', w * 0.25, h * 0.12 + Math.min(w, h) * 0.017); });
  }
