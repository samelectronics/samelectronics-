<!doctype html>
<!-- R6 §11 · the Repair Lab bench, rendered one layer at a time from one fixed camera so the layers register exactly:
     ?layer=<mat|body|screen-crack|screen-new|screen-boot|bat-old|bat-new|port-old|port-new|cup|pick>&w=<px>
     The page animates the layers (site/src/components/dc/SERepairFilm.tsx). -->
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const Q = new URLSearchParams(location.search), LAYER = Q.get('layer') || 'all', W = +(Q.get('w') || 1280), H = Math.round(W * 0.6875);
const PI = Math.PI, deg = (d) => (d * PI) / 180;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.32;
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 40); cam.position.set(0.0, 2.35, 1.75); cam.lookAt(0.02, 0, 0.06);

// warm overhead bench light + cool fill
const key = new THREE.SpotLight(0xffd9a6, 70, 9, deg(36), 0.75, 1.6); key.position.set(-0.6, 3.2, 0.9); key.target.position.set(0, 0, 0); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.bias = -0.0003; scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.5); fill.position.set(2.5, 1.6, 2.2); scene.add(fill);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x202124, 0.16));

const cv = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); draw(x, w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const rr = (x, X, Y, w, h, r) => { x.beginPath(); x.roundRect(X, Y, w, h, r); };

// ---------- the ESD mat: graphite rubber, fine grid, faint traces, the brand corner mark; the heat plate on it ----------
const matTex = cv(2048, 1408, (x, w, h) => {
  x.fillStyle = '#25272a'; x.fillRect(0, 0, w, h);
  const id = x.getImageData(0, 0, w, h), d = id.data; for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * 9; d[i] += n; d[i + 1] += n; d[i + 2] += n; } x.putImageData(id, 0, 0);
  x.strokeStyle = 'rgba(255,255,255,.045)'; x.lineWidth = 1; for (let i = 0; i < w; i += 32) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, h); x.stroke(); } for (let j = 0; j < h; j += 32) { x.beginPath(); x.moveTo(0, j); x.lineTo(w, j); x.stroke(); }
  x.strokeStyle = 'rgba(247,192,50,.09)'; x.lineWidth = 3; x.lineCap = 'round';
  [[[60, 1300], [60, 1100], [140, 1020], [520, 1020]], [[1990, 120], [1800, 120], [1720, 200], [1720, 380]], [[1990, 1250], [1700, 1250], [1640, 1190], [1400, 1190]]].forEach((p) => { x.beginPath(); x.moveTo(p[0][0], p[0][1]); p.slice(1).forEach(([a, b]) => x.lineTo(a, b)); x.stroke(); const e = p[p.length - 1]; x.beginPath(); x.arc(e[0], e[1], 9, 0, 7); x.stroke(); });
  x.fillStyle = 'rgba(255,255,255,.18)'; x.font = '600 26px Arial'; x.fillText('ESD SAFE · SAM ELECTRONICS · DEIRA BENCH', 70, 70);
});
const mat = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 3.16), new THREE.MeshStandardMaterial({ map: matTex, roughness: 0.92 })); mat.rotation.x = -PI / 2; mat.receiveShadow = true;
const plate = new THREE.Mesh(new RoundedBoxGeometry(1.9, 0.03, 1.05, 3, 0.012), new THREE.MeshStandardMaterial({ color: 0x9aa0a6, roughness: 0.38, metalness: 0.85 })); plate.position.set(0.02, 0.015, 0.06); plate.receiveShadow = true; plate.castShadow = true;
const shadowFloor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.ShadowMaterial({ opacity: 0.45 })); shadowFloor.rotation.x = -PI / 2; shadowFloor.position.y = 0.0305; shadowFloor.receiveShadow = true;

// ---------- the phone, lying on the plate, screen side up, long side across ----------
const L = 1.5, Wd = 0.72, Hh = 0.07, Y0 = 0.031;
const phone = new THREE.Group(); phone.position.set(0.02, Y0, 0.06); phone.rotation.y = deg(-6);
const rshape = (w, h, r) => { const s = new THREE.Shape(), a = -w / 2, b = -h / 2; s.moveTo(a + r, b); s.lineTo(a + w - r, b); s.quadraticCurveTo(a + w, b, a + w, b + r); s.lineTo(a + w, b + h - r); s.quadraticCurveTo(a + w, b + h, a + w - r, b + h); s.lineTo(a + r, b + h); s.quadraticCurveTo(a, b + h, a, b + h - r); s.lineTo(a, b + r); s.quadraticCurveTo(a, b, a + r, b); return s; };
// housing: a titanium-grey frame ring with a dark back inside
const ring = (() => { const s = rshape(L, Wd, 0.12), hole = rshape(L - 0.05, Wd - 0.05, 0.1); s.holes.push(hole); const g = new THREE.ExtrudeGeometry(s, { depth: Hh, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 4, curveSegments: 24 }); g.rotateX(-PI / 2); return new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x8c8f94, roughness: 0.28, metalness: 0.95 })); })();
const back = (() => { const g = new THREE.ShapeGeometry(rshape(L - 0.05, Wd - 0.05, 0.1), 24); g.rotateX(-PI / 2); const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x1c1d20, roughness: 0.7, metalness: 0.3 })); m.position.y = 0.004; return m; })();
const body = new THREE.Group(); body.add(ring, back);
// logic board (L-shaped, black PCB, gold pads, shields), connectors, a mid-frame bracket
const pcbTex = cv(512, 512, (x, w, h) => { x.fillStyle = '#16231b'; x.fillRect(0, 0, w, h); x.strokeStyle = 'rgba(196,160,80,.5)'; x.lineWidth = 1.2; for (let i = 0; i < 60; i++) { x.beginPath(); let a = rnd() * w, b = rnd() * h; x.moveTo(a, b); for (let k = 0; k < 4; k++) { if (rnd() < 0.5) a += (rnd() - 0.5) * 120; else b += (rnd() - 0.5) * 120; x.lineTo(a, b); } x.stroke(); } for (let i = 0; i < 90; i++) { x.fillStyle = rnd() < 0.5 ? '#c9a24a' : '#2a2d30'; x.fillRect(rnd() * w, rnd() * h, 4 + rnd() * 8, 3 + rnd() * 5); } });
const boardMat = new THREE.MeshStandardMaterial({ map: pcbTex, roughness: 0.5, metalness: 0.3 });
const shield = new THREE.MeshStandardMaterial({ color: 0xb8bcc2, roughness: 0.32, metalness: 1 });
const board = new THREE.Mesh(new RoundedBoxGeometry(0.42, 0.012, 0.58, 2, 0.004), boardMat); board.position.set(-0.47, 0.016, 0); body.add(board);
[[-0.52, 0.12, 0.16, 0.2], [-0.42, -0.12, 0.2, 0.16], [-0.6, -0.15, 0.08, 0.12]].forEach(([px, pz, w, d]) => { const s = new THREE.Mesh(new RoundedBoxGeometry(w, 0.018, d, 2, 0.003), shield); s.position.set(px, 0.028, pz); body.add(s); });
const camMod = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.04, 32), new THREE.MeshStandardMaterial({ color: 0x0c0c0e, roughness: 0.2, metalness: 0.6 })); camMod.position.set(-0.6, 0.03, 0.2); body.add(camMod);
const conn = (px, pz, w) => { const c = new THREE.Mesh(new THREE.BoxGeometry(w, 0.012, 0.035), new THREE.MeshStandardMaterial({ color: 0x18191b, roughness: 0.4 })); c.position.set(px, 0.028, pz); body.add(c); };
conn(-0.3, 0.2, 0.09); conn(-0.3, 0.07, 0.07); conn(-0.3, -0.06, 0.07);
const screws = new THREE.MeshStandardMaterial({ color: 0xd8dadd, roughness: 0.25, metalness: 1 }); [[-0.66, -0.24], [-0.27, -0.25], [-0.27, 0.25], [0.66, 0.26]].forEach(([a, b]) => { const s = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.01, 16), screws); s.position.set(a, 0.03, b); body.add(s); });
// the speaker + taptic at the far end
const spk = new THREE.Mesh(new RoundedBoxGeometry(0.16, 0.03, 0.22, 2, 0.006), new THREE.MeshStandardMaterial({ color: 0x2a2b2e, roughness: 0.6 })); spk.position.set(0.6, 0.02, -0.12); body.add(spk);

// battery: silver pouch with printed label (old = worn, new = crisp)
const batTex = (fresh) => cv(512, 360, (x, w, h) => { const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, fresh ? '#e9ebee' : '#cfd1d4'); g.addColorStop(1, fresh ? '#c9ccd1' : '#a9acb0'); x.fillStyle = g; x.fillRect(0, 0, w, h); x.fillStyle = fresh ? '#26282B' : '#4a4c50'; x.font = 'bold 30px Arial'; x.fillText(fresh ? 'Li-ion Battery · NEW' : 'Li-ion Battery', 34, 70); x.font = '20px Arial'; ['Rated capacity 3274 mAh', 'Nominal voltage 3.87 V', fresh ? 'SAM ELECTRONICS · TESTED' : 'Cycle count 812'].forEach((l, i) => x.fillText(l, 34, 120 + i * 32)); if (fresh) { x.fillStyle = '#F7C032'; x.fillRect(34, 250, 180, 10); } else { x.fillStyle = 'rgba(0,0,0,.12)'; for (let i = 0; i < 40; i++) x.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 30, 1); } });
const battery = (fresh) => { const b = new THREE.Mesh(new RoundedBoxGeometry(0.62, 0.035, 0.52, 3, 0.012), [new THREE.MeshStandardMaterial({ color: 0xbfc2c6, roughness: 0.35, metalness: 0.7 }), new THREE.MeshStandardMaterial({ color: 0xbfc2c6, roughness: 0.35, metalness: 0.7 }), new THREE.MeshStandardMaterial({ map: batTex(fresh), roughness: 0.35, metalness: 0.55 }), new THREE.MeshStandardMaterial({ color: 0x9a9da1 }), new THREE.MeshStandardMaterial({ color: 0xbfc2c6, roughness: 0.35, metalness: 0.7 }), new THREE.MeshStandardMaterial({ color: 0xbfc2c6, roughness: 0.35, metalness: 0.7 })]); b.position.set(0.12, 0.024, 0.02); const fl = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.004, 0.05), new THREE.MeshPhysicalMaterial({ color: 0xc9781d, roughness: 0.35, clearcoat: 0.6 })); fl.position.set(-0.24, 0.035, 0.2); const g = new THREE.Group(); g.add(b, fl); return g; };
// the charging-port flex at the far end: orange ribbon, USB-C / Lightning port, microphone
const portFlex = (fresh) => { const g = new THREE.Group(), cu = new THREE.MeshPhysicalMaterial({ color: fresh ? 0xd6852a : 0xa96a2a, roughness: fresh ? 0.3 : 0.5, clearcoat: fresh ? 0.7 : 0.2 }); const r = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.006, 0.5), cu); r.position.set(0.58, 0.02, 0.06); const p = new THREE.Mesh(new RoundedBoxGeometry(0.05, 0.035, 0.13, 2, 0.01), new THREE.MeshStandardMaterial({ color: 0xc7cacf, roughness: 0.3, metalness: 1 })); p.position.set(0.69, 0.035, 0.06); const c = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.012, 0.035), new THREE.MeshStandardMaterial({ color: 0x18191b })); c.position.set(0.56, 0.028, 0.28); g.add(r, p, c); return g; };

// screens: glass slab with an OLED stack edge, flex out of one side; cracked, new, booted
const screenTex = (kind) => cv(1400, 680, (x, w, h) => {
  const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#0d0e10'); g.addColorStop(0.5, '#050506'); g.addColorStop(1, '#0b0c0e'); x.fillStyle = g; x.fillRect(0, 0, w, h);
  if (kind === 'boot') { const gl = x.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, h * 0.7); gl.addColorStop(0, '#2b2c30'); gl.addColorStop(1, '#0a0a0b'); x.fillStyle = gl; x.fillRect(0, 0, w, h); x.save(); x.translate(w / 2, h / 2); x.rotate(PI / 2); x.strokeStyle = '#F7C032'; x.lineWidth = 14; x.beginPath(); x.arc(0, -40, 96, 0, 7); x.stroke(); x.fillStyle = '#F7C032'; x.beginPath(); x.arc(0, -40, 60, 0, 7); x.fill(); x.fillStyle = '#26282B'; x.font = 'bold 54px Arial'; x.textAlign = 'center'; x.fillText('SE', 0, -22); x.fillStyle = '#FFFFFF'; x.font = '600 34px Arial'; x.fillText('SAM ELECTRONICS', 0, 120); x.fillStyle = '#F7C032'; x.font = '22px Arial'; x.fillText('QUALITY · WARRANTY · PRICE', 0, 160); x.restore(); }
  if (kind === 'crack') { // impact low-left, radial cracks with branching, concentric ring breaks, a few chipped shards catching the light
    const ix = w * 0.24, iy = h * 0.66; x.lineCap = 'round';
    for (let k = 0; k < 26; k++) { let a = (k / 26) * PI * 2 + rnd() * 0.2, px = ix, py = iy; const len = 120 + rnd() * 900; x.beginPath(); x.moveTo(px, py); for (let s = 0; s < len; s += 18) { a += (rnd() - 0.5) * 0.35; px += Math.cos(a) * 18; py += Math.sin(a) * 18; x.lineTo(px, py); if (rnd() < 0.06) { x.moveTo(px, py); let b = a + (rnd() - 0.5) * 1.6, qx = px, qy = py; for (let t = 0; t < 8; t++) { b += (rnd() - 0.5) * 0.4; qx += Math.cos(b) * 14; qy += Math.sin(b) * 14; x.lineTo(qx, qy); } x.moveTo(px, py); } } x.strokeStyle = 'rgba(200,210,220,.32)'; x.lineWidth = 1.1; x.stroke(); x.strokeStyle = 'rgba(255,255,255,.05)'; x.lineWidth = 4; x.stroke(); }
    for (let r = 30; r < 220; r += 26 + rnd() * 20) { x.beginPath(); for (let a = 0; a < PI * 2; a += 0.3) { if (rnd() < 0.35) { x.moveTo(ix + Math.cos(a) * r, iy + Math.sin(a) * r); continue; } x.lineTo(ix + Math.cos(a) * (r + (rnd() - 0.5) * 8), iy + Math.sin(a) * (r + (rnd() - 0.5) * 8)); } x.strokeStyle = 'rgba(210,220,230,.24)'; x.lineWidth = 1; x.stroke(); }
    for (let i = 0; i < 40; i++) { const a = rnd() * PI * 2, r = rnd() * 150, sx = ix + Math.cos(a) * r, sy = iy + Math.sin(a) * r; x.fillStyle = `rgba(255,255,255,${0.05 + rnd() * 0.18})`; x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx + (rnd() - 0.5) * 40, sy + (rnd() - 0.5) * 40); x.lineTo(sx + (rnd() - 0.5) * 40, sy + (rnd() - 0.5) * 40); x.fill(); }
    x.fillStyle = 'rgba(255,255,255,.35)'; x.beginPath(); x.arc(ix, iy, 6, 0, 7); x.fill(); }
  x.fillStyle = '#000'; rr(x, w - 70, h * 0.36, 40, h * 0.28, 20); x.fill(); // the island, at the top edge (phone lies sideways)
});
const screen = (kind) => { const s = rshape(L - 0.012, Wd - 0.012, 0.115), g = new THREE.ExtrudeGeometry(s, { depth: 0.022, bevelEnabled: true, bevelThickness: 0.004, bevelSize: 0.004, bevelSegments: 3, curveSegments: 24 }); g.rotateX(-PI / 2);
  // planar UVs from x/z
  const pos = g.attributes.position, uv = new Float32Array(pos.count * 2); for (let i = 0; i < pos.count; i++) { uv[i * 2] = pos.getX(i) / L + 0.5; uv[i * 2 + 1] = 0.5 - pos.getZ(i) / Wd; } g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  const glass = new THREE.MeshPhysicalMaterial({ map: screenTex(kind), emissiveMap: kind === 'boot' ? screenTex('boot') : null, emissive: kind === 'boot' ? 0xffffff : 0x000000, emissiveIntensity: kind === 'boot' ? 0.9 : 0, roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.2 });
  const m = new THREE.Mesh(g, [glass, new THREE.MeshStandardMaterial({ color: 0x111214, roughness: 0.5 })]); m.position.y = Hh + 0.006; m.castShadow = true; const grp = new THREE.Group(); grp.add(m); return grp; };
// tools
const cup = (() => { const g = new THREE.Group(), m = new THREE.MeshPhysicalMaterial({ color: 0x8a8e94, roughness: 0.35, transmission: 0.35, thickness: 0.02, transparent: true, opacity: 0.92 }); const c = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.13, 0.05, 48), m); c.position.y = 0.025; const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.03, 0.08, 24), new THREE.MeshStandardMaterial({ color: 0x2b2c2f, roughness: 0.5 })); stem.position.y = 0.09; const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.012, 16, 48), new THREE.MeshStandardMaterial({ color: 0xF7C032, roughness: 0.4 })); ring2.position.y = 0.15; ring2.rotation.y = PI / 2; g.add(c, stem, ring2); g.position.set(0.35, Hh + 0.03, 0.12); g.traverse((o) => { if (o.isMesh) o.castShadow = true; }); return g; })();
const pick = (() => { const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(0.22, 0.06); s.quadraticCurveTo(0.26, 0.0, 0.22, -0.06); s.closePath(); const g = new THREE.ExtrudeGeometry(s, { depth: 0.006, bevelEnabled: false }); g.rotateX(-PI / 2); const m = new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({ color: 0x2f7be6, roughness: 0.25, transmission: 0.4, thickness: 0.01, transparent: true, opacity: 0.9 })); m.position.set(-0.05, Hh + 0.004, Wd / 2 - 0.02); m.rotation.y = deg(-95); m.castShadow = true; return m; })();

// ---------- which layer ----------
const depthOnly = (o) => { o.traverse((m) => { if (m.isMesh) { const mm = Array.isArray(m.material) ? m.material : [m.material]; m.material = mm.map((x) => { const c = x.clone(); c.colorWrite = false; return c; }); if (m.material.length === 1) m.material = m.material[0]; m.castShadow = false; } }); return o; };
body.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
const LAYERS = {
  mat: () => { scene.add(mat, plate); },
  body: () => { scene.add(shadowFloor); phone.add(body); },
  'bat-old': () => { phone.add(depthOnly(body.clone()), battery(false)); },
  'bat-new': () => { phone.add(depthOnly(body.clone()), battery(true)); },
  'port-old': () => { phone.add(depthOnly(body.clone()), portFlex(false)); },
  'port-new': () => { phone.add(depthOnly(body.clone()), portFlex(true)); },
  'screen-crack': () => { scene.add(shadowFloor); phone.add(screen('crack')); },
  'screen-new': () => { scene.add(shadowFloor); phone.add(screen('new')); },
  'screen-boot': () => { phone.add(screen('boot')); },
  cup: () => { scene.add(shadowFloor); phone.add(cup); },
  pick: () => { scene.add(shadowFloor); phone.add(pick); },
  all: () => { scene.add(mat, plate); phone.add(body, battery(false), portFlex(false), screen('crack'), cup, pick); },
};
(LAYERS[LAYER] || LAYERS.all)(); scene.add(phone);
renderer.render(scene, cam);
window.__done = true;
</script>
